<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f49eb" />
    <!-- Stale page guard: a page kept from an earlier deploy (e.g. a Safari tab restored on iOS) asks for hashed /assets/ files the current deploy no longer has (404) and shows up almost unstyled. A failed stylesheet or script under /assets/ reloads the page once to fetch the current HTML; a sessionStorage stamp stops a reload loop (at most one reload per 30s). Must stay above the injected asset tags. -->
    <script>addEventListener('error',function(e){var t=e.target,u=t&&(t.href||t.src);if(!u||(t.tagName!=='LINK'&&t.tagName!=='SCRIPT')||String(u).indexOf('/assets/')<0)return;try{var k='unblocked-asset-reload',l=Number(sessionStorage.getItem(k))||0;if(Date.now()-l<30000)return;sessionStorage.setItem(k,String(Date.now()))}catch(_){return}location.reload()},true)</script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Per-page title / description / Open Graph tags, filled from src/app/seo/seo-content.json by the server and the static build. -->
    <!--seo--><!--/seo-->
  </head>
  <body>
    <!-- Boot cover in the page's curtain colour (hero colour; keep in sync with src/app/components/page-curtain/curtainColors.js). Bridges the gap between pages until the app mounts (removed by App); hides itself after 6s if the app never starts. -->
    <script>(function(){var c={'/':'#2850fe','/posters':'#000000','/guidelines':'#101010','/grants':'#101010','/grants/culture-grants':'#2449ed','/grants/open-systems':'#f546a4','/submit':'#dc91a8'};var p=location.pathname.replace(/\/$/,'')||'/';var v=c[p]||'#2449ed';if(p.indexOf('/submit')===0)v=matchMedia('(max-width: 600px), (max-width: 864px) and (orientation: portrait)').matches?'#000000':c['/submit'];document.documentElement.style.setProperty('--curtain-color',v)})()</script>
    <style>#boot-cover{position:fixed;inset:0;z-index:1001;background:var(--curtain-color,#2850fe);animation:boot-cover-fallback 0s 6s forwards}@keyframes boot-cover-fallback{to{visibility:hidden}}@media (prefers-reduced-motion:reduce){#boot-cover{display:none}}</style>
    <div id="boot-cover" aria-hidden="true"></div>
    <noscript><style>#boot-cover{display:none}</style></noscript>
    <div id="root"><!--ssr-outlet--></div><script type="module" src="/src/entry-client.jsx"></script></body>
</html>
